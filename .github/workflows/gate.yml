name: dependency-gate

# Runs the import-time dependency gate on the testbed for every pull request. A flagged
# dependency fails the job, so the pull request goes red before it can be merged. Findings are
# uploaded as SARIF so they appear inline in the GitHub "Code scanning" tab.

on:
  pull_request:
    paths:
      - 'testbed/**'
      - 'src/**'
      - '.github/workflows/gate.yml'

permissions:
  contents: read
  security-events: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 12 (install scripts blocked by default)
        run: npm install -g npm@12

      - name: Install the gate's own dependencies
        run: npm ci

      - name: Install the testbed with the lockfile (no scripts run)
        working-directory: testbed
        run: npm ci

      - name: Run the dependency gate
        id: gate
        working-directory: testbed
        run: node ../src/cli.js scan . --format sarif --out ../gate.sarif

      # Code scanning upload needs GitHub Advanced Security on private repositories. It is
      # allowed to fail so that the job's verdict always reflects the gate itself.
      - name: Upload findings to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gate.sarif
          category: import-gate
